<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>AZAROV — GiftBot</title>
    <!-- Early splash art only — do not preload the full asset catalog.
         Prefer animated WebP; GIF remains as <picture> fallback. -->
    <link
      rel="preload"
      as="image"
      href="/splash-loading.webp?v=%ASSET_BUILD_ID%"
      type="image/webp"
    />
    <style>
      /* Critical boot paint — before JS/CSS bundles. */
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #000000;
        color: #f8fafc;
      }
      #azarov-boot-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
        padding: max(1.25rem, env(safe-area-inset-top, 0px))
          max(1.25rem, env(safe-area-inset-right, 0px))
          max(1.25rem, env(safe-area-inset-bottom, 0px))
          max(1.25rem, env(safe-area-inset-left, 0px));
        background: #000000;
        opacity: 1;
        transition: opacity 280ms ease;
        pointer-events: auto;
        overflow: hidden;
      }
      #azarov-boot-splash.is-hiding {
        opacity: 0;
        pointer-events: none;
      }
      #azarov-boot-splash picture {
        display: block;
        line-height: 0;
      }
      #azarov-boot-splash .splash-media-wrap {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        isolation: isolate;
      }
      /* Light edge haze only — keep most of the face sharp */
      #azarov-boot-splash .splash-media-wrap::after {
        content: '';
        position: absolute;
        inset: -10%;
        z-index: 1;
        pointer-events: none;
        background: radial-gradient(
          ellipse 78% 74% at 50% 46%,
          transparent 58%,
          rgb(0 0 0 / 22%) 78%,
          rgb(0 0 0 / 72%) 92%,
          #000 100%
        );
      }
      #azarov-boot-splash .splash-media {
        width: min(58vw, 14rem);
        max-width: 240px;
        max-height: min(52vh, 280px);
        height: auto;
        object-fit: contain;
        display: block;
        user-select: none;
        -webkit-user-drag: none;
        /* Soft rim only near the outer edge */
        -webkit-mask-image: radial-gradient(
          ellipse 88% 86% at 50% 46%,
          #000 0%,
          #000 72%,
          rgb(0 0 0 / 0.7) 88%,
          transparent 100%
        );
        mask-image: radial-gradient(
          ellipse 88% 86% at 50% 46%,
          #000 0%,
          #000 72%,
          rgb(0 0 0 / 0.7) 88%,
          transparent 100%
        );
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-size: 100% 100%;
        mask-size: 100% 100%;
      }
      #azarov-boot-splash .splash-brand {
        position: relative;
        z-index: 5;
        margin: 1.25rem 0 0;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        font-size: clamp(1.05rem, 4.2vw, 1.35rem);
        font-weight: 700;
        letter-spacing: 0.02em;
        line-height: 1.25;
        text-align: center;
        color: #f8fafc;
        text-transform: none;
        text-shadow: 0 1px 10px rgb(0 0 0 / 85%);
        pointer-events: none;
      }
      #root {
        min-height: 100%;
      }
    </style>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      /* Capture referral start_param before React / WebApp.ready() can drop launch hash. */
      (function () {
        try {
          var key = 'azarov_tg_start_param'
          var sp = ''
          var wa = window.Telegram && window.Telegram.WebApp
          if (wa) {
            if (wa.initData) {
              sp = new URLSearchParams(wa.initData).get('start_param') || ''
            }
            if (!sp && wa.initDataUnsafe && wa.initDataUnsafe.start_param) {
              sp = String(wa.initDataUnsafe.start_param)
            }
          }
          if (!sp) {
            var q = new URLSearchParams(location.search)
            sp = q.get('tgWebAppStartParam') || q.get('startapp') || ''
          }
          if (!sp && location.hash) {
            var h = location.hash.replace(/^#/, '')
            var hp = new URLSearchParams(h.charAt(0) === '?' ? h.slice(1) : h)
            sp = hp.get('tgWebAppStartParam') || hp.get('startapp') || ''
          }
          if (sp) {
            sessionStorage.setItem(key, String(sp).trim())
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div
      id="azarov-boot-splash"
      role="presentation"
      aria-hidden="false"
      data-shown-at=""
    >
      <div class="splash-media-wrap">
        <picture>
          <source
            srcset="/splash-loading.webp?v=%ASSET_BUILD_ID%"
            type="image/webp"
          />
          <img
            class="splash-media"
            src="/splash-loading.gif?v=%ASSET_BUILD_ID%"
            alt=""
            width="240"
            height="318"
            decoding="async"
          />
        </picture>
      </div>
      <p class="splash-brand">Загрузка Бота...</p>
    </div>
    <script>
      ;(function () {
        var el = document.getElementById('azarov-boot-splash')
        if (el) {
          el.setAttribute('data-shown-at', String(Date.now()))
        }
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
