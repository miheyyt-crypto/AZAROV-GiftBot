# Reverse proxy for the Mini App static files and the API process only.
# Bot and Worker expose health on localhost and must not serve Mini App routes.

upstream giftbot_api {
    server 127.0.0.1:3000;
    keepalive 16;
}

# TLS material lives on the host, not in git.
# ssl_certificate     /etc/giftbot/tls/fullchain.pem;
# ssl_certificate_key /etc/giftbot/tls/privkey.pem;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name _;

    ssl_certificate     /etc/giftbot/tls/fullchain.pem;
    ssl_certificate_key /etc/giftbot/tls/privkey.pem;

    root /opt/giftbot/current/apps/web/dist;
    client_max_body_size 256k;

    location /auth/      { proxy_pass http://giftbot_api; include /opt/giftbot/current/deploy/nginx/proxy_params; }
    location /admin/     { proxy_pass http://giftbot_api; include /opt/giftbot/current/deploy/nginx/proxy_params; }
    location /broadcasts/ { proxy_pass http://giftbot_api; include /opt/giftbot/current/deploy/nginx/proxy_params; }
    location /giveaways/ { proxy_pass http://giftbot_api; include /opt/giftbot/current/deploy/nginx/proxy_params; }
    location /bootstrap  { proxy_pass http://giftbot_api; include /opt/giftbot/current/deploy/nginx/proxy_params; }
    location /sections/  { proxy_pass http://giftbot_api; include /opt/giftbot/current/deploy/nginx/proxy_params; }
    location /kick/      { proxy_pass http://giftbot_api; include /opt/giftbot/current/deploy/nginx/proxy_params; }
    location /games/     { proxy_pass http://giftbot_api; include /opt/giftbot/current/deploy/nginx/proxy_params; }
    location /rounds/    { proxy_pass http://giftbot_api; include /opt/giftbot/current/deploy/nginx/proxy_params; }
    location /cases/     { proxy_pass http://giftbot_api; include /opt/giftbot/current/deploy/nginx/proxy_params; }
    location /products/  { proxy_pass http://giftbot_api; include /opt/giftbot/current/deploy/nginx/proxy_params; }
    location /tasks/     { proxy_pass http://giftbot_api; include /opt/giftbot/current/deploy/nginx/proxy_params; }
    location /referrals/ { proxy_pass http://giftbot_api; include /opt/giftbot/current/deploy/nginx/proxy_params; }
    location /telegram/  { proxy_pass http://giftbot_api; include /opt/giftbot/current/deploy/nginx/proxy_params; }
    location /health/    { proxy_pass http://giftbot_api; include /opt/giftbot/current/deploy/nginx/proxy_params; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
